<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FluidBurn</title>
    <script>
      // Stamp data-theme before any stylesheet applies, so the first paint is
      // already the right colour. The store mirrors the user's choice into
      // localStorage; with no choice saved we follow the OS. App.tsx keeps
      // this attribute in sync from then on.
      (function () {
        var t = null;
        try { t = localStorage.getItem("fluidburn.theme"); } catch (e) {}
        var dark =
          t === "Dark" ||
          (t !== "Light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
