name: Release

# Build macOS DMG + Windows installers and attach them to a GitHub Release.
# Triggered by pushing a version tag, e.g.  git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write # needed to create the GitHub Release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish (unsigned)
        uses: tauri-apps/tauri-action@v0
        # NOTE: Both builds are UNSIGNED (no Apple Developer Program / no
        # Windows code-signing cert). macOS Gatekeeper and Windows SmartScreen
        # will warn users — see releaseBody for the one-time bypass steps.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "FluidBurn ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ### Install (macOS)
            1. Download **FluidBurn_*_universal.dmg** below.
            2. Open it and drag **FluidBurn** to **Applications**.
            3. This build is not signed by Apple, so on first launch open **Terminal** and run:
               ```
               xattr -cr /Applications/FluidBurn.app
               ```
               then open FluidBurn normally. (One time only.)

            > Alternatively: right-click the app → **Open**, and if macOS still blocks it,
            > go to **System Settings → Privacy & Security** and click **Open Anyway**.

            ### Install (Windows)
            1. Download **FluidBurn_*_x64-setup.exe** below (or the `.msi` if you prefer).
            2. Run it. This build isn't code-signed, so SmartScreen may show
               "Windows protected your PC" — click **More info → Run anyway**.
            3. If WebView2 isn't installed, the installer fetches it automatically.
